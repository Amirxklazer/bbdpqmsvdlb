name: Compile AOS 11 TUI Kernel

on: [push]

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
    - name: Checkout Your Repo
      uses: actions/checkout@v4

    - name: Clone TegraExplorer Engine
      run: |
        git clone --recursive https://github.com build_env
        
    - name: Inject AOS Code
      run: |
        # Delete original file manager code
        rm build_env/source/main.c
        # Copy your AOS Terminal code into the source folder
        cp aos_main.c build_env/source/main.c

    - name: Compile Payload
      run: |
        cd build_env
        make

    - name: Package for Switch
      run: |
        mkdir -p sd_card/bootloader/payloads
        # Move the compiled binary and rename it
        cp build_env/TegraExplorer.bin sd_card/bootloader/payloads/aos11_tui.bin
        
        # Create Hekate Config
        mkdir -p sd_card/bootloader/ini
        echo "[AOS 11 TUI]" > sd_card/bootloader/ini/aos11_tui.ini
        echo "payload=bootloader/payloads/aos11_tui.bin" >> sd_card/bootloader/ini/aos11_tui.ini

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AOS11_TUI_System
        path: sd_card/
